<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>{{MASTHEAD_TITLE}} · 第{{ISSUE_NO}}期</title>
<style>
/* ==========================================================================
   QQ日报 · 版面样式
   参考中文报纸的通行做法：宋体正文 / 黑体标题 / 楷体引语；
   粗线分隔大版块、细线分隔小栏目、双线收尾；一个强调色 #b3261e 只用于
   报头装饰、栏目名、引语标记，不滥用。
   页面骨架由 程序\出报主程序.py 的 compose_pages() 拼好后替换进 body 的占位符，
   这里只负责"长什么样"。
   注意：本文件里除 body 那一个占位符外，不要再出现同名占位符字面串 ——
   包括注释里也不行，否则 replace 会替换两次（踩过）。
   ========================================================================== */

@page { size: A4; margin: 10mm 11mm 8mm 11mm; }
* { box-sizing: border-box; }
body {
  margin: 0; color: #17181a; background: #fff;
  font-family: "SimSun", "宋体", serif;
  font-size: 10.6pt; line-height: 1.46;
  -webkit-print-color-adjust: exact; print-color-adjust: exact;
}

/* 每版高度 = A4 高 − 上下页边距 = 297 − 10 − 8 = 279mm
   overflow:hidden 是硬约束：一版就是一版，多出来的内容被裁掉而不是溢成第二张纸。
   版面高度靠 程序\出报主程序.py 的 content_quota() 在生成内容阶段就控好，
   不指望 CSS 自己收（column-fill 在分页上下文里不可靠）。 */
/* ---------------------------------------------------------------- 粗体策略
   ⚠ Windows 的 SimSun / SimHei / KaiTi **都只有单一字重，没有真粗体**。
     写 font-weight:700 会触发浏览器「合成加粗」（描粗偏移叠加）：
       ≥14pt —— 可接受，甚至正好像报纸的「粗宋/大标宋」，是我们要的味道
       <12pt —— 笔画糊成一团，完全不可读
   所以：小字号一律不加粗，靠黑体本身的重量 + 字号拉开层级；
        只有 ≥14pt 的大标题才允许加粗。
   小字号的强调手段改用：换字体（宋→黑）、反白底、下划线。 */
h1, h2, h3, h4, h5, b, strong, th, dt { font-weight: 400; }
h1.title, h1.banner, h2.headline, .bignum, .adbox .big { font-weight: 900; }

.page { position: relative; height: 279mm; overflow: hidden; padding-bottom: 7mm; }
/* 分页用 break-before 而不是 break-after：每版高度正好等于可打印高度，
   在版末写 break-after:always 会因边界取整多顶出一张空白纸（实测 6 版出 7 张）。
   改成「后一版之前强制分页」就没有这个问题。 */
.page + .page { break-before: page; }

/* ---------------------------------------------------------------- 分隔线 */
.rule-thick  { border-top: 3px solid #17181a; margin: 6px 0; }
.rule-double { border-top: 3px double #17181a; margin: 6px 0; }
.rule-thin   { border-top: 1px solid #17181a; margin: 5px 0; }
.rule-hair   { border-top: .5px solid #bbb; margin: 5px 0; }
.rule-dot    { border-top: 1px dotted #8a8a8a; margin: 5px 0; }
.rule-red    { border-top: 2px solid #b3261e; margin: 5px 0; }

/* ---------------------------------------------------------------- 报头 */
.masthead { border-bottom: 3px double #17181a; padding-bottom: 3px; margin-bottom: 6px; }
.mh-top { display: flex; justify-content: space-between; align-items: flex-end;
          font-size: 8.7pt; letter-spacing: .4px; }
.mh-row { display: flex; align-items: flex-end; gap: 10px; margin: 2px 0 1px; }
.mh-title { flex: 1 1 0; }
h1.title { margin: 0; text-align: center; font-family: "SimHei","黑体",sans-serif;
           font-size: 46.0pt; letter-spacing: 9px; line-height: 1.02; font-weight: 900; }
.mh-en { text-align: center; font-size: 8.0pt; letter-spacing: 2.4px; color: #666;
         font-family: Georgia, serif; margin-top: 1px; }
/* 报眼：报头两侧的小方框，报纸上常放简讯或标语 */
.ear { flex: 0 0 21%; border: 1px solid #17181a; padding: 3px 5px; font-size: 8.3pt;
       line-height: 1.42; }
.ear b { font-family: "SimHei","黑体",sans-serif; font-size: 8.7pt; display: block;
         border-bottom: 1px solid #17181a; margin-bottom: 2px; padding-bottom: 1px; }
.ear .red { color: #b3261e; }
.mh-meta { display: flex; justify-content: space-between; font-size: 8.7pt;
           border-top: 1px solid #17181a; margin-top: 3px; padding-top: 2px; }
.stamp { display: inline-block; border: 1.5px solid #b3261e; color: #b3261e;
         font-family: "SimHei","黑体",sans-serif; font-size: 9.0pt; padding: 0 5px;
         transform: rotate(-1.6deg); }

/* ---------------------------------------------------------------- 版眉与页码 */
.runhead { display: flex; justify-content: space-between; align-items: center;
           font-family: "SimHei","黑体",sans-serif; font-size: 9.4pt; letter-spacing: .4px;
           border-top: 2px solid #17181a; border-bottom: 1px solid #17181a;
           padding: 1px 0 2px; margin-bottom: 6px; }
.runhead .pn { color: #b3261e; font-size: 11.5pt; letter-spacing: 1px; }
/* 版脚必须绝对定位：进文档流的话内容量一变它就漂，而且白占约 8mm 把版面顶溢出 */
.folio { position: absolute; left: 0; right: 0; bottom: 0;
         display: flex; justify-content: space-between; font-size: 8.5pt; color: #555;
         border-top: 1px solid #17181a; padding-top: 1.5px; }

/* ---------------------------------------------------------------- 栏目名 */
h2.sec { font-family: "SimHei","黑体",sans-serif; font-size: 13.2pt; margin: 5px 0 3px;
         border-bottom: 2px solid #17181a; padding-bottom: 1px; letter-spacing: .8px; }
h2.sec small { font-size: 8.0pt; color: #888; font-family: Georgia, serif; letter-spacing: 1px;
               font-weight: normal; }
h2.sec.red { border-bottom-color: #b3261e; color: #b3261e; }
/* 小一号的栏目名：窄栏和次要栏目用，省地方 */
h2.sec.sm { font-size: 11.3pt; margin: 4px 0 2px; border-bottom-width: 1px; }
h2.sec.sm small { font-size: 7.6pt; }
/* 本期要目：报眼那种小方框，头版侧栏用来把版面补满 */
.box.index { background: #faf8f3; }
.box.index ol { margin: 0; padding-left: 15px; font-size: 9.4pt; line-height: 1.5; }
.box.index li { margin-bottom: 1px; }
/* 编务启事：几条空栏目的说明合到一条，不各占一个框 */
.biznote { border-top: 1px solid #17181a; border-bottom: 1px solid #17181a;
           padding: 3px 4px; margin: 4px 0; font-size: 8.7pt; color: #444; line-height: 1.42; }
.biznote b { font-family: "SimHei","黑体",sans-serif; color: #b3261e; }
/* 本报征稿启事：版面填不满时补的启事（蓝色大肥鱼口吻）。虚框、浅底，明摆着是"凑版"的 */
.solicit { border: 2px dashed #b3261e; background: #fbf7f2; padding: 7px 9px 6px;
           margin: 7px 0 4px; break-inside: avoid; }
.solicit-t { font-family: "SimHei","黑体",sans-serif; font-size: 12.6pt; color: #b3261e;
             text-align: center; letter-spacing: 2px; margin-bottom: 4px; }
.solicit .indent { font-size: 10.6pt; }
.solicit-f { font-size: 10.1pt; margin-top: 3px; }
.solicit-s { font-family: "KaiTi","楷体",serif; font-size: 10.8pt; text-align: right;
             margin-top: 2px; color: #333; }
/* 报花：蓝色大肥鱼女仆照（网上找的网友二创，非商用），空白处填版用 */
.mascot { text-align: center; margin: 7px 0 4px; break-inside: avoid;
          border: 1px solid #cfd8e3; background: #f7fbff; padding: 5px 6px 4px; }
.mascot img { max-width: 100%; object-fit: contain; }
.mascot-c { font-size: 9.0pt; color: #33475b; margin-top: 3px; line-height: 1.4; }
.mascot-c b { font-family: "SimHei","黑体",sans-serif; color: #1f6fa8; }
.mascot-s { font-size: 7.6pt; color: #9aa7b4; margin-top: 1px; }
h3.cross { font-family: "SimHei","黑体",sans-serif; font-size: 12.0pt; margin: 5px 0 2px;
           letter-spacing: .4px; }

/* ---------------------------------------------------------------- 标题层级 */
.kicker { font-family: "SimHei","黑体",sans-serif; font-size: 10.3pt; color: #b3261e;
          letter-spacing: 1.5px; margin-bottom: 1px; }
.kicker::after { content: ""; display: block; width: 34px; border-top: 2px solid #b3261e;
                 margin-top: 2px; }
h1.banner { font-family: "SimHei","黑体",sans-serif; font-size: 28.7pt; line-height: 1.14;
            margin: 3px 0 4px; letter-spacing: 1px; text-wrap: balance; font-weight: 900; }
h2.headline { font-family: "SimHei","黑体",sans-serif; font-size: 19.5pt; line-height: 1.2;
              margin: 2px 0 3px; letter-spacing: .6px; text-wrap: balance; }
h3.headline-s { font-family: "SimHei","黑体",sans-serif; font-size: 14.4pt; line-height: 1.24;
                margin: 2px 0 2px; letter-spacing: .3px; }
.deck { font-family: "KaiTi","楷体",serif; font-size: 12.2pt; line-height: 1.45; color: #333;
        border-left: 4px solid #b3261e; padding-left: 7px; margin: 3px 0 5px; }
.deck.plain { border-left: none; padding-left: 0; color: #444; font-size: 11.3pt; }
.byline { font-size: 9.0pt; color: #666; letter-spacing: .3px; margin-bottom: 3px; }
.byline b { font-family: "SimHei","黑体",sans-serif; color: #17181a; font-weight: normal; }
.dateline { font-family: "SimHei","黑体",sans-serif; font-size: 9.9pt; }

/* ---------------------------------------------------------------- 正文 */
p { margin: 0 0 3px; text-align: justify; text-justify: inter-ideograph; }
.indent { text-indent: 2em; }
.lead-para { font-family: "KaiTi","楷体",serif; font-size: 11.7pt; line-height: 1.55;
             text-indent: 2em; margin-bottom: 4px; }
/* 首字下沉 */
.dropcap::first-letter { font-family: "SimHei","黑体",sans-serif; font-size: 31.0pt;
                         line-height: .84; float: left; padding: 1px 4px 0 0; color: #b3261e; }

/* ---------------------------------------------------------------- 分栏 */
.cols2 { column-count: 2; column-gap: 14px; column-rule: .5px solid #c9c9c9; }
.cols3 { column-count: 3; column-gap: 12px; column-rule: .5px solid #c9c9c9; }
.cols2.norule, .cols3.norule { column-rule: none; }
.cols2 > .avoid, .cols3 > .avoid { break-inside: avoid; }
.flex { display: flex; gap: 13px; align-items: flex-start; }
.flex > .grow { flex: 1 1 0; min-width: 0; }
.flex > .side { flex: 0 0 32%; }
.flex > .side-wide { flex: 0 0 42%; }

/* ---------------------------------------------------------------- 引语与摘句 */
.pullquote { border-top: 2px solid #17181a; border-bottom: 2px solid #17181a;
             padding: 5px 2px; margin: 6px 0; break-inside: avoid; }
.pullquote .q { font-family: "KaiTi","楷体",serif; font-size: 14.9pt; line-height: 1.4;
                text-align: center; }
.pullquote .a { font-size: 8.7pt; color: #777; text-align: center; margin-top: 2px; }
.pullquote.big .q { font-size: 19.5pt; }
/* 竖排引语（报纸上的「花边语录」） */
.quotecard { border: 1px solid #17181a; border-left: 4px solid #b3261e; padding: 4px 7px;
             margin-bottom: 5px; break-inside: avoid; }
.quotecard .q { font-family: "KaiTi","楷体",serif; font-size: 12.2pt; line-height: 1.42; }
.quotecard .a { font-size: 8.5pt; color: #777; text-align: right; margin-top: 2px; }

/* ---------------------------------------------------------------- 边栏与花边 */
.box { border: 1px solid #17181a; padding: 5px 7px; margin-bottom: 6px; break-inside: avoid; }
.box.tint { background: #f6f4ee; border-color: #cfc7b6; }
.box h4 { font-family: "SimHei","黑体",sans-serif; font-size: 11.0pt; margin: 0 0 3px;
          border-bottom: 1px solid #b3261e; color: #b3261e; padding-bottom: 1px;
          letter-spacing: .5px; }
.box.dashed { border: 1.5px dashed #b3261e; color: #b3261e; }
/* 启事／致歉：头版侧栏最上方，双线花边框，要显眼 */
.noticebox { border: 3px double #17181a; background: #f6f4ee; padding: 6px 7px 5px; margin-bottom: 7px;
             break-inside: avoid; }
.noticebox-t { font-family: "SimHei","黑体",sans-serif; font-size: 12.6pt; color: #b3261e;
               text-align: center; letter-spacing: 2px; padding-bottom: 3px; margin-bottom: 4px;
               border-bottom: 1px solid #17181a; }
.noticebox-b { font-size: 9.5pt; line-height: 1.5; text-align: justify; text-indent: 2em; }
.noticebox-s { font-family: "KaiTi","楷体",serif; font-size: 9.9pt; text-align: right;
               margin-top: 3px; color: #333; }
/* 国内要闻：当天真实新闻（非时政），浅底加两道细线，跟群内内容区分开 */
.realnews { background: #f6f4ee; border-top: 1.5px solid #17181a; border-bottom: 1.5px solid #17181a;
            padding: 4px 6px 5px; margin: 2px 0 5px; break-inside: avoid; }
.realnews-t { font-family: "SimHei","黑体",sans-serif; font-size: 10.3pt; color: #b3261e;
              letter-spacing: 1.5px; margin-bottom: 3px; }
.realnews-t span { font-family: Georgia, serif; font-size: 8.0pt; color: #888;
                   letter-spacing: .5px; margin-left: 5px; }
.realnews .rn { font-size: 9.9pt; line-height: 1.5; margin-bottom: 3px; text-align: justify; }
.realnews .rn-s { font-family: "SimHei","黑体",sans-serif; font-size: 8.7pt; color: #b3261e;
                  margin-right: 4px; }
.sidebar-title { font-family: "SimHei","黑体",sans-serif; font-size: 11.5pt; text-align: center;
                 border-top: 1px solid #17181a; border-bottom: 1px solid #17181a;
                 padding: 2px 0; margin-bottom: 4px; letter-spacing: 1px; }

/* ---------------------------------------------------------------- 简讯与列表 */
.brief { margin-bottom: 4px; break-inside: avoid; }
.brief b { font-family: "SimHei","黑体",sans-serif; }
.brief .k { color: #b3261e; }
.brief-inline { display: inline; }
.timeline div { display: flex; gap: 6px; margin-bottom: 2px; break-inside: avoid; }
.timeline .t { font-family: Georgia, serif; color: #b3261e; flex: 0 0 34px; font-size: 10.1pt; }
.oneline { font-size: 10.6pt; }
.oneline p { margin-bottom: 2px; }
.oneline .mark { color: #b3261e; font-family: "SimHei","黑体",sans-serif; }

/* ---------------------------------------------------------------- 数字 */
.statgrid { display: flex; flex-wrap: wrap; gap: 6px; }
.statcell { flex: 1 1 46%; border: 1px solid #17181a; padding: 3px 5px; text-align: center; }
.statcell .n { font-family: Georgia, serif; font-size: 19.5pt; font-weight: bold;
               color: #b3261e; line-height: 1.05; }
/* 昵称当冠军名时不能用 17pt Georgia，会撑爆格子 —— 用 n2 */
.statcell .n2 { font-family: "SimHei","黑体",sans-serif; font-size: 12.1pt;
                color: #b3261e; line-height: 1.25; word-break: break-all; }
.statcell .l { font-size: 8.5pt; color: #444; }
/* 表格下方的小字吐槽（蓝色大肥鱼口吻） */
.quip { font-family: "KaiTi","楷体",serif; font-size: 9.4pt; color: #555;
        border-left: 3px solid #b3261e; padding-left: 5px; margin-top: 3px; line-height: 1.45; }
.bars div { display: flex; align-items: center; gap: 5px; font-size: 8.7pt; margin-bottom: 1px; }
.bars .bar { height: 6px; background: #17181a; display: inline-block; }
.bars .hr { flex: 0 0 22px; font-family: Georgia, serif; color: #b3261e; }

/* ---------------------------------------------------------------- 图片
   ⚠ 2026-10-07 改了规矩（豹饼干："有些图片字只截到一半"）：
   群里的图**大多数是带字的截图**（聊天记录、游戏结算页、文档），
   一律 object-fit:cover 会把下半截的字切掉 —— 所以现在分两类：
     · 带字的截图 → 加 class="nocrop"，**整张等比缩小**（contain + 白底），
       宁可留白，绝不许切字；
     · 纯照片 → 仍然 cover（配合 Qwen 先裁好主体），免得一张图横占版面。
   分类由 程序\智能裁剪.py 让 Qwen（能看图）判断，判不准一律按"截图"处理。 */
figure { margin: 0 0 5px; break-inside: avoid; }
figure img { width: 100%; display: block; border: 1px solid #9a9a9a;
             object-fit: cover; object-position: top center; }
/* 带字截图：整张等比缩小，白底补边，一个字都不切 */
figure img.nocrop { object-fit: contain; background: #fff; }
figcaption { font-size: 8.3pt; color: #555; padding-top: 1px; line-height: 1.34; }
/* 主图：整幅宽，但不许超过页面净高的 1/6 */
.imghero img { height: 176px; }
/* 成排：两张并排 */
.imgrow { display: flex; gap: 8px; align-items: flex-start; }
.imgrow figure { flex: 1 1 0; min-width: 0; }
.imgrow figure img { height: 132px; }
.imgrow.tall figure img { height: 168px; }
/* 单张占一排时只给半幅宽 —— 以前单图 .imgrow 会拉满 741px，横着吃掉一大条版面 */
.imgrow.solo figure { flex: 0 0 47%; }
/* 小图网格：一排放三张，用来把影像版排满 */
.imggrid { display: flex; gap: 7px; align-items: flex-start; margin-bottom: 4px; }
.imggrid figure { flex: 1 1 0; min-width: 0; margin-bottom: 2px; }
.imggrid figure img { height: 104px; }
.imggrid.tall figure img { height: 140px; }
figure .credit { font-size: 7.8pt; color: #999; }

/* ---------------------------------------------------------------- 聊天截图 */
.chat { border: 1px solid #c2c6cc; background: #f4f5f7; font-family: "Microsoft YaHei","微软雅黑",sans-serif;
        font-size: 9.2pt; break-inside: avoid; }
.chat-head { background: #e6e8eb; padding: 2px 7px; font-size: 8.3pt; color: #444;
             border-bottom: 1px solid #d2d5d9; display: flex; justify-content: space-between; }
.chat-body { padding: 5px 6px; }
.msg { margin-bottom: 4px; }
.who { display: block; font-size: 7.8pt; color: #7a7d82; margin-bottom: 1px; }
.bubble { display: inline-block; background: #fff; border: 1px solid #dfe1e5; border-radius: 8px;
          padding: 2px 7px; max-width: 96%; line-height: 1.45; }
.bubble.me { background: #c8e6ff; border-color: #a8d4f5; }
.chat-cap { font-size: 8.5pt; color: #666; margin-top: 2px; text-align: right; }

/* ---------------------------------------------------------------- 读者来信 */
.letters .letter { border-bottom: 1px dotted #9a9a9a; padding: 3px 0; break-inside: avoid; }
.letters .letter:last-child { border-bottom: none; }
.letters .who2 { font-family: "SimHei","黑体",sans-serif; font-size: 9.9pt; }
.letters .role { font-size: 8.0pt; color: #b3261e; border: 1px solid #b3261e; padding: 0 3px;
                 margin-left: 3px; }
.letters .body { font-size: 10.1pt; }

/* ---------------------------------------------------------------- 页脚与报花 */
.colophon { border-top: 2px solid #17181a; margin-top: 7px; padding-top: 4px;
            font-size: 8.7pt; color: #444; line-height: 1.5; }
.adbox { border: 1px solid #17181a; text-align: center; padding: 5px 4px; break-inside: avoid; }
.adbox .big { font-family: "SimHei","黑体",sans-serif; font-size: 12.6pt; letter-spacing: 1px; }
.adbox .sm { font-size: 8.3pt; color: #666; }
.keep { font-family: "SimHei","黑体",sans-serif; border: 1.5px dashed #b3261e; color: #b3261e;
        padding: 3px 6px; font-size: 9.2pt; display: inline-block; }
.center { text-align: center; }
.dim { color: #666; }
.small { font-size: 8.7pt; line-height: 1.45; }
</style>
</head>
<body>
